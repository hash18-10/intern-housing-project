<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Housing Price Predictor</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f6f8fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h2 {
      color: #2b2d42;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 20px;
      background: #eaf4e6;
      padding: 15px;
      border-left: 5px solid #28a745;
      border-radius: 8px;
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="navbar">
  <a href="/descriptive">Descriptive Stats</a>
  <a href="/inferential">Inferential Stats</a>
  <a href="/">Prediction</a>
</div>

<style>
  .navbar {
    background-color: #007bff;
    padding: 14px;
    text-align: center;
    border-radius: 8px;
    margin-bottom: 30px;
  }

  .navbar a {
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-weight: 600;
  }

  .navbar a:hover {
    text-decoration: underline;
  }
</style>

  <h2>🏠 Housing Price Predictor</h2>
  
  <form method="POST" action="/predict">
    <label>Total Bedrooms:</label>
    <input type="number" name="total_bedrooms" step="any" required />

    <label>Households:</label>
    <input type="number" name="households" step="any" required />

    <label>Latitude:</label>
    <input type="number" name="latitude" step="any" required />

    <label>Longitude:</label>
    <input type="number" name="longitude" step="any" required />

    <label>Population:</label>
    <input type="number" name="population" step="any" required />

    <button type="submit">Predict Price</button>

    {% if prediction %}
      <div class="result">
        Predicted Price: {{ prediction }}
      </div>
    {% endif %}
  </form>
</body>
</html>
